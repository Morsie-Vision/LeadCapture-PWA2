<script>
// ============================================================
// KONFIGURATION
// ============================================================
const API_URL = 'https://leadcapture-backend.onrender.com/api';

// ============================================================
// TOKEN-VERWALTUNG
// ============================================================
function getToken() {
    return localStorage.getItem('leadcapture_token');
}

function setToken(token) {
    localStorage.setItem('leadcapture_token', token);
}

function removeToken() {
    localStorage.removeItem('leadcapture_token');
    localStorage.removeItem('leadcapture_user');
}

function getUser() {
    const user = localStorage.getItem('leadcapture_user');
    return user ? JSON.parse(user) : null;
}

function setUser(user) {
    localStorage.setItem('leadcapture_user', JSON.stringify(user));
}

function isLoggedIn() {
    return !!getToken();
}

// ============================================================
// LOGIN / REGISTER FUNKTIONEN
// ============================================================
async function login(email, password) {
    const response = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    });
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'Login fehlgeschlagen');
    return result.data;
}

async function register(email, password, fullName, tenantName) {
    const response = await fetch(`${API_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, fullName, tenantName })
    });
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'Registrierung fehlgeschlagen');
    return result.data;
}

// ============================================================
// KONFIGURATION
// ============================================================
const API_URL = 'https://leadcapture-backend.onrender.com/api';

// ============================================================
// TOKEN-VERWALTUNG
// ============================================================
function getToken() {
    return localStorage.getItem('leadcapture_token');
}

function setToken(token) {
    localStorage.setItem('leadcapture_token', token);
}

function removeToken() {
    localStorage.removeItem('leadcapture_token');
    localStorage.removeItem('leadcapture_user');
}

function getUser() {
    const user = localStorage.getItem('leadcapture_user');
    return user ? JSON.parse(user) : null;
}

function setUser(user) {
    localStorage.setItem('leadcapture_user', JSON.stringify(user));
}

function isLoggedIn() {
    return !!getToken();
}

// ============================================================
// API HELPER (mit Token)
// ============================================================
async function apiRequest(endpoint, options = {}) {
    const token = getToken();
    if (!token) {
        throw new Error('Nicht eingeloggt');
    }
    
    const response = await fetch(`${API_URL}${endpoint}`, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            ...(options.headers || {})
        }
    });
    
    if (response.status === 401) {
        // Token ungültig → Logout
        removeToken();
        showLogin();
        throw new Error('Session abgelaufen. Bitte erneut einloggen.');
    }
    
    return response;
}

// ============================================================
// LOGIN / REGISTER
// ============================================================
async function login(email, password) {
    const response = await fetch(`${API_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    });
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'Login fehlgeschlagen');
    return result.data;
}

async function register(email, password, fullName, tenantName) {
    const response = await fetch(`${API_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, fullName, tenantName })
    });
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'Registrierung fehlgeschlagen');
    return result.data;
}

// ============================================================
// HILFSFUNKTIONEN
// ============================================================
function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
    setTimeout(() => { errorBox.style.display = 'none'; }, 6000);
}

function setStatus(message, show = true) {
    statusText.textContent = message;
    statusDiv.style.display = show ? 'flex' : 'none';
}

function setLoading(loading) {
    if (loading) { setStatus('DeepSeek analysiert...', true); uploadBtn.disabled = true; }
    else { setStatus('', false); uploadBtn.disabled = false; }
}

function fillForm(data) {
    fields.firstName.value = data.first_name || data.firstName || '';
    fields.lastName.value = data.last_name || data.lastName || '';
    fields.company.value = data.company || '';
    fields.position.value = data.position || '';
    fields.email.value = data.email || '';
    fields.phone.value = data.phone || '';
    fields.street.value = data.street || data.address?.street || '';
    fields.zip.value = data.zip || data.address?.zip || '';
    fields.city.value = data.city || data.address?.city || '';
    fields.interests.value = Array.isArray(data.interests) ? data.interests.join(', ') : '';
    fields.visitorType.value = data.visitor_type || data.visitorType || '';
}

function clearForm() {
    Object.values(fields).forEach(f => f.value = '');
    previewContainer.style.display = 'none';
    previewImage.src = '';
    fileInput.value = '';
    setStatus('', false);
    errorBox.style.display = 'none';
}

function getFormData() {
    return {
        firstName: fields.firstName.value,
        lastName: fields.lastName.value,
        company: fields.company.value,
        position: fields.position.value,
        email: fields.email.value,
        phone: fields.phone.value,
        address: {
            street: fields.street.value,
            zip: fields.zip.value,
            city: fields.city.value
        },
        interests: fields.interests.value.split(',').map(s => s.trim()).filter(Boolean),
        visitorType: fields.visitorType.value,
        questionnaire: {}
    };
}

// ============================================================
// LEADS (mit API)
// ============================================================
async function processWithDeepSeek(base64Image) {
    const response = await apiRequest('/process-image', {
        method: 'POST',
        body: JSON.stringify({ image: base64Image })
    });
    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'Unbekannter Fehler');
    return result;
}

async function loadLeads() {
    try {
        const response = await apiRequest('/leads');
        const result = await response.json();
        if (result.success) {
            displayLeads(result.data);
        } else {
            leadsList.innerHTML = `<div class="empty-leads">❌ Fehler: ${result.error}</div>`;
        }
    } catch (error) {
        if (error.message.includes('Nicht eingeloggt')) {
            showLogin();
        } else {
            leadsList.innerHTML = `<div class="empty-leads">❌ Fehler: ${error.message}</div>`;
        }
    }
}

function displayLeads(leads) {
    leadsContainer.style.display = 'block';
    leadsCount.textContent = `${leads.length} Einträge`;
    if (leads.length === 0) {
        leadsList.innerHTML = '<div class="empty-leads">📭 Noch keine Leads gespeichert.</div>';
        return;
    }
    let html = '';
    leads.forEach(lead => {
        const hasQuestionnaire = lead.questionnaire && Object.keys(lead.questionnaire).length > 0;
        html += `
            <div class="lead-card">
                <div class="header">
                    <span class="name">${lead.first_name || ''} ${lead.last_name || ''}</span>
                    <span class="company">${lead.company || 'Keine Firma'}</span>
                </div>
                <div class="details">${lead.position || 'Keine Position'} ${lead.email ? '· ✉️ ' + lead.email : ''} ${lead.phone ? '· 📞 ' + lead.phone : ''}</div>
                ${lead.street || lead.zip || lead.city ? `<div class="details">📍 ${lead.street || ''}${lead.zip ? ', ' + lead.zip : ''}${lead.city ? ' ' + lead.city : ''}</div>` : ''}
                ${lead.interests?.length ? `<div class="details">🏷️ ${lead.interests.join(', ')}</div>` : ''}
                <div class="meta">🕐 ${lead.created_at ? new Date(lead.created_at).toLocaleString() : ''} ${hasQuestionnaire ? ' 📝 Fragebogen ausgefüllt' : ''}</div>
                <div class="actions">
                    <button class="edit" onclick="editLead('${lead.id}')">✏️ Bearbeiten</button>
                    <button class="questionnaire" onclick="openQuestionnaire('${lead.id}')">📝 Fragebogen</button>
                    <button class="delete" onclick="deleteLead('${lead.id}')">🗑️ Löschen</button>
                </div>
            </div>
        `;
    });
    leadsList.innerHTML = html;
}

async function deleteLead(id) {
    if (!confirm('Lead wirklich löschen?')) return;
    try {
        const response = await apiRequest(`/leads/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) loadLeads();
        else alert('Fehler beim Löschen: ' + result.error);
    } catch (error) { alert('Fehler: ' + error.message); }
}

async function editLead(id) {
    try {
        const response = await apiRequest('/leads');
        const result = await response.json();
        if (result.success) {
            const lead = result.data.find(l => l.id === id);
            if (lead) { fillForm(lead); alert('✅ Lead in Formular geladen'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        }
    } catch (error) { alert('Fehler: ' + error.message); }
}

async function saveLeadManually() {
    const leadData = getFormData();
    if (!leadData.firstName && !leadData.lastName && !leadData.company) {
        alert('❌ Bitte mindestens einen Namen oder Firma eingeben.');
        return;
    }
    try {
        const response = await apiRequest('/leads', {
            method: 'POST',
            body: JSON.stringify({ lead: leadData })
        });
        const result = await response.json();
        if (result.success) { alert('✅ Lead gespeichert!'); loadLeads(); clearForm(); }
        else alert('❌ Fehler: ' + result.error);
    } catch (error) { alert('❌ Fehler: ' + error.message); }
}

// ============================================================
// FRAGEBOGEN
// ============================================================
async function openQuestionnaire(leadId) {
    currentLeadId = leadId;
    questionnaireContainer.style.display = 'block';
    try {
        const response = await apiRequest(`/questionnaire/${leadId}`);
        const result = await response.json();
        if (result.success) {
            questionnaireLeadName.textContent = result.data.leadName || 'Unbekannt';
            renderQuestionnaire(result.data.answers || {});
        } else {
            alert('Fehler beim Laden des Fragebogens: ' + result.error);
        }
    } catch (error) { alert('Fehler: ' + error.message); }
    window.scrollTo({ top: document.getElementById('questionnaireContainer').offsetTop - 100, behavior: 'smooth' });
}

function renderQuestionnaire(answers) {
    let html = '';
    DEFAULT_QUESTIONS.forEach(q => {
        const value = answers[q.id] || '';
        if (q.type === 'select') {
            html += `<div class="questionnaire-answer"><label for="q_${q.id}">${q.label}</label><select id="q_${q.id}">${q.options.map(opt => `<option value="${opt}" ${opt === value ? 'selected' : ''}>${opt}</option>`).join('')}</select></div>`;
        } else {
            html += `<div class="questionnaire-answer"><label for="q_${q.id}">${q.label}</label><textarea id="q_${q.id}" rows="2">${value}</textarea></div>`;
        }
    });
    questionnaireForm.innerHTML = html;
}

async function saveQuestionnaire() {
    if (!currentLeadId) { alert('❌ Kein Lead ausgewählt.'); return; }
    const answers = {};
    DEFAULT_QUESTIONS.forEach(q => {
        const el = document.getElementById(`q_${q.id}`);
        if (el) answers[q.id] = el.value;
    });
    try {
        const response = await apiRequest(`/questionnaire/${currentLeadId}`, {
            method: 'POST',
            body: JSON.stringify({ answers })
        });
        const result = await response.json();
        if (result.success) { alert('✅ Fragebogen gespeichert!'); loadLeads(); questionnaireContainer.style.display = 'none'; }
        else alert('❌ Fehler: ' + result.error);
    } catch (error) { alert('❌ Fehler: ' + error.message); }
}

function closeQuestionnaire() {
    questionnaireContainer.style.display = 'none';
    currentLeadId = null;
}

// ============================================================
// CSV-EXPORT & IMPORT
// ============================================================
async function exportCSV() {
    try {
        const response = await apiRequest('/export/csv');
        if (!response.ok) {
            const error = await response.json();
            alert('❌ Fehler beim Export: ' + (error.error || response.status));
            return;
        }
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `leads_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    } catch (error) { alert('❌ Fehler beim Export: ' + error.message); }
}

importCsvBtn.addEventListener('click', () => { csvFileInput.click(); });

csvFileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.name.endsWith('.csv')) {
        alert('❌ Bitte wähle eine CSV-Datei aus.');
        csvFileInput.value = '';
        return;
    }
    if (file.size > 10 * 1024 * 1024) {
        alert('❌ Datei zu groß (max 10 MB).');
        csvFileInput.value = '';
        return;
    }
    if (!confirm(`📥 Möchtest du die Datei "${file.name}" wirklich importieren?`)) {
        csvFileInput.value = '';
        return;
    }
    try {
        const formData = new FormData();
        formData.append('file', file);
        setStatus('📥 Importiere CSV...', true);
        importCsvBtn.disabled = true;
        
        const token = getToken();
        const response = await fetch(`${API_URL}/import/csv`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
        });
        const result = await response.json();
        if (result.success) {
            alert(`✅ Import erfolgreich!\n📥 ${result.imported} neue Leads\n🔄 ${result.updated} aktualisiert`);
            loadLeads();
            clearForm();
        } else {
            throw new Error(result.error || 'Unbekannter Fehler');
        }
    } catch (error) {
        alert('❌ Fehler beim Import: ' + error.message);
    } finally {
        setStatus('', false);
        importCsvBtn.disabled = false;
        csvFileInput.value = '';
    }
});

// Dropbox-Import
importDropboxBtn.addEventListener('click', async () => {
    if (!confirm('☁️ Möchtest du die neueste CSV aus Dropbox importieren?')) return;
    try {
        setStatus('☁️ Lade aus Dropbox...', true);
        importDropboxBtn.disabled = true;
        const response = await apiRequest('/import/dropbox', { method: 'POST' });
        const result = await response.json();
        if (result.success) {
            alert(`☁️ Dropbox-Import erfolgreich!\n📥 ${result.imported} neue Leads\n🔄 ${result.updated} aktualisiert`);
            loadLeads();
            clearForm();
        } else {
            throw new Error(result.error || 'Unbekannter Fehler');
        }
    } catch (error) {
        alert('❌ Fehler beim Dropbox-Import: ' + error.message);
    } finally {
        setStatus('', false);
        importDropboxBtn.disabled = false;
    }
});

// ============================================================
// HISTOGRAMM
// ============================================================
async function loadHistogram(year = 'alle') {
    try {
        const url = year === 'alle' ? '/stats/daily' : `/stats/daily?year=${year}`;
        const response = await apiRequest(url);
        const result = await response.json();
        if (!result.success) throw new Error(result.error || 'Unbekannter Fehler');
        updateYearSelect(result.availableYears || []);
        renderHistogram(result.data, result.totalLeads);
        histogramTotal.textContent = `📊 ${result.totalLeads} Leads`;
    } catch (error) {
        histogramEmpty.style.display = 'block';
        histogramEmpty.textContent = '❌ Fehler: ' + error.message;
        histogram.style.display = 'none';
    }
}

function updateYearSelect(availableYears) {
    const currentValue = yearSelect.value;
    const currentOptions = Array.from(yearSelect.options).map(o => o.value);
    const newYears = ['alle', ...availableYears.map(y => String(y))];
    if (JSON.stringify(currentOptions) === JSON.stringify(newYears)) return;
    yearSelect.innerHTML = '';
    newYears.forEach(y => {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y === 'alle' ? 'Alle Jahre' : String(y);
        yearSelect.appendChild(opt);
    });
    yearSelect.value = currentValue;
}

function renderHistogram(data, totalLeads) {
    histogram.innerHTML = '';
    histogramEmpty.style.display = 'none';
    histogram.style.display = 'flex';
    if (!data || data.length === 0) {
        histogramEmpty.style.display = 'block';
        histogramEmpty.textContent = '📭 Keine Leads für diesen Zeitraum.';
        histogram.style.display = 'none';
        return;
    }
    const maxCount = Math.max(...data.map(d => d.count), 1);
    const maxHeight = 180;
    data.forEach(item => {
        const height = (item.count / maxCount) * maxHeight;
        const wrapper = document.createElement('div');
        wrapper.className = 'bar-wrapper';
        wrapper.style.height = `${Math.max(height + 14, 18)}px`;
        const valueLabel = document.createElement('div');
        valueLabel.className = 'bar-value';
        valueLabel.textContent = item.count;
        wrapper.appendChild(valueLabel);
        const fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.height = `${height}px`;
        wrapper.appendChild(fill);
        wrapper.title = `${item.date}: ${item.count} Lead(s)`;
        wrapper.addEventListener('click', () => alert(`Am ${item.date} wurden ${item.count} Leads erfasst.`));
        wrapper.addEventListener('mouseenter', () => {
            fill.style.background = 'linear-gradient(180deg, #63B3ED 0%, #3182CE 100%)';
        });
        wrapper.addEventListener('mouseleave', () => {
            fill.style.background = 'linear-gradient(180deg, #4A90E2 0%, #357ABD 100%)';
        });
        histogram.appendChild(wrapper);
    });
}

function toggleHistogram() {
    histogramVisible = !histogramVisible;
    histogramContainer.style.display = histogramVisible ? 'block' : 'none';
    toggleHistogramBtn.textContent = histogramVisible ? '📊 Histogramm ausblenden' : '📊 Histogramm anzeigen';
    if (histogramVisible) loadHistogram(yearSelect.value);
}

// ============================================================
// BILDVERARBEITUNG
// ============================================================
async function handleImage(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) { showError('Bitte wähle ein Bild aus (JPG, PNG).'); return; }
    if (file.size > 10 * 1024 * 1024) { showError('Bild zu groß (max 10MB).'); return; }
    const reader = new FileReader();
    reader.onload = async (event) => {
        const base64Image = event.target.result;
        previewImage.src = base64Image;
        previewContainer.style.display = 'block';
        setLoading(true);
        try {
            const result = await processWithDeepSeek(base64Image);
            fillForm(result.data);
            setStatus(`✅ Lead gespeichert! ID: ${result.saved.id}`, true);
            setTimeout(() => setStatus('', false), 3000);
            loadLeads();
        } catch (error) { showError(`Parsing fehlgeschlagen: ${error.message}`); setStatus('', false); }
        finally { setLoading(false); }
    };
    reader.onerror = () => { showError('Fehler beim Lesen der Datei.'); setLoading(false); };
    reader.readAsDataURL(file);
}

// ============================================================
// EVENT LISTENER
// ============================================================
uploadArea.addEventListener('click', () => fileInput.click());
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleImage(e.target.files[0]); });
uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#4A90E2'; uploadArea.style.background = '#edf2f7'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#cbd5e0'; uploadArea.style.background = '#f7fafc'; });
uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#cbd5e0'; uploadArea.style.background = '#f7fafc'; if (e.dataTransfer.files.length > 0) handleImage(e.dataTransfer.files[0]); });
clearBtn.addEventListener('click', clearForm);
saveBtn.addEventListener('click', saveLeadManually);
refreshLeadsBtn.addEventListener('click', loadLeads);
exportCsvBtn.addEventListener('click', exportCSV);
closeQuestionnaireBtn.addEventListener('click', closeQuestionnaire);
saveQuestionnaireBtn.addEventListener('click', saveQuestionnaire);
toggleHistogramBtn.addEventListener('click', toggleHistogram);
refreshHistogramBtn.addEventListener('click', () => loadHistogram(yearSelect.value));
yearSelect.addEventListener('change', () => loadHistogram(yearSelect.value));
